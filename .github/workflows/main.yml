name: Build lists

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run build_list.py
        env:
          CF_RADAR_TOKEN: ${{ secrets.CF_RADAR_TOKEN }}
        run: |
          python -m pip install --quiet requests
          python build_list.py

      - name: Update domain lists
        run: |
          git diff --quiet -- direct.list proxy.list && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add direct.list proxy.list
          git commit -m "Update domain lists"
          git push
